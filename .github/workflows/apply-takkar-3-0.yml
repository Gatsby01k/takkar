name: Apply TAKKAR Arcade 3.0

on:
  push:
    branches: [main]
    paths:
      - '.release/takkar-3.0.0/**'
      - '.github/workflows/apply-takkar-3-0.yml'

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore TAKKAR Arcade 3.0 sources
        shell: bash
        run: |
          set -euo pipefail
          cat .release/takkar-3.0.0/part*.txt | base64 -d > /tmp/takkar-3.0.0.tar.gz
          echo 'c07eb3b8996bc4945a77bc57db01a541555ca10c920923b406397fbcaeabefe9  /tmp/takkar-3.0.0.tar.gz' | sha256sum -c -
          tar -xzf /tmp/takkar-3.0.0.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate new runtime
        run: |
          npm run check
          npm test

      - name: Publish real source files to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/takkar-3.0.0
          rm -f .github/workflows/apply-takkar-3-0.yml
          git config user.name 'TAKKAR Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes found'
            exit 1
          fi
          git commit -m 'feat: ship TAKKAR Arcade 3.0 motion rebuild'
          git push origin HEAD:main
