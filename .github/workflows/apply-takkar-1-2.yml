name: Apply TAKKAR 1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.release/takkar-1.2.0/**'
      - '.github/workflows/apply-takkar-1-2.yml'

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore TAKKAR 1.2.0 sources
        shell: bash
        run: |
          set -euo pipefail
          cat .release/takkar-1.2.0/part*.txt | base64 -d > /tmp/takkar-1.2.0.tar.gz
          echo 'ff713f6ebe83415d4ae618412262c7c2999a211c4546db20c3f4d33d2d5823b4  /tmp/takkar-1.2.0.tar.gz' | sha256sum -c -
          tar -xzf /tmp/takkar-1.2.0.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate runtime
        run: |
          npm run check
          npm test

      - name: Publish real source files to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/takkar-1.2.0
          rm -f .github/workflows/apply-takkar-1-2.yml UNPACK_NOW
          git config user.name 'TAKKAR Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes found'
            exit 1
          fi
          git commit -m 'feat: ship TAKKAR 1.2.0 desktop impact rebuild'
          git push origin HEAD:main
