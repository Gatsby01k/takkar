name: Apply TAKKAR Arcade 2.0

on:
  push:
    branches: [main]
    paths:
      - '.release/takkar-2.0.0/**'
      - '.github/workflows/apply-takkar-2-0.yml'

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore TAKKAR Arcade 2.0 sources
        shell: bash
        run: |
          set -euo pipefail
          cat .release/takkar-2.0.0/part*.txt | base64 -d > /tmp/takkar-2.0.0.tar.gz
          echo 'c59addaf462b6ed07892cfc978b9125a51a405b96f0593c49ca74aea1d317e03  /tmp/takkar-2.0.0.tar.gz' | sha256sum -c -
          mkdir -p /tmp/takkar-2.0.0
          tar -xzf /tmp/takkar-2.0.0.tar.gz -C /tmp/takkar-2.0.0
          cp /tmp/takkar-2.0.0/arcade.js public/arcade.js
          cp /tmp/takkar-2.0.0/arcade.css public/arcade.css
          cp /tmp/takkar-2.0.0/index.html public/index.html
          cp /tmp/takkar-2.0.0/smoke.mjs scripts/smoke.mjs
          cp /tmp/takkar-2.0.0/package.json package.json

      - name: Validate new runtime
        run: |
          npm run check
          npm test

      - name: Publish real source files to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/takkar-2.0.0
          rm -f .github/workflows/apply-takkar-2-0.yml
          git config user.name 'TAKKAR Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: launch TAKKAR Arcade 2.0 viral rebuild'
          git push origin HEAD:main
